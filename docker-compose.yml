# ============================================
# OpenClaw 3D Voice Agents — Docker Compose
# ============================================
# Cloud deployment: docker compose up --build -d
#
# Requires .env file with:
#   LIVEKIT_URL=wss://lexi-claw-s7tmu0rh.livekit.cloud
#   LIVEKIT_API_KEY=<your_key>
#   LIVEKIT_API_SECRET=<your_secret>
#   TOKEN_SERVER_PORT=8081
# ============================================

x-agent-common: &agent-common
  restart: unless-stopped
  env_file: .env
  networks:
    - openclaw
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: '0.25'

services:
  # Token server + 3D frontend
  token-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${TOKEN_SERVER_PORT:-8081}:${TOKEN_SERVER_PORT:-8081}"
    env_file: .env
    environment:
      - TOKEN_SERVER_PORT=${TOKEN_SERVER_PORT:-8081}
    volumes:
      - ./agents_config.json:/app/agents_config.json:ro
      - ./static:/app/static:ro
      - openclaw-memory:/app/.memory
    networks:
      - openclaw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TOKEN_SERVER_PORT:-8081}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  sentinel:
    <<: *agent-common
    build: ./agents/sentinel
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  oracle:
    <<: *agent-common
    build: ./agents/oracle
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  phantom:
    <<: *agent-common
    build: ./agents/phantom
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  cipher:
    <<: *agent-common
    build: ./agents/cipher
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  aegis:
    <<: *agent-common
    build: ./agents/aegis
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  nexus:
    <<: *agent-common
    build: ./agents/nexus
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  specter:
    <<: *agent-common
    build: ./agents/specter
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  vanguard:
    <<: *agent-common
    build: ./agents/vanguard
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

networks:
  openclaw:
    driver: bridge

volumes:
  openclaw-memory:
    driver: local
